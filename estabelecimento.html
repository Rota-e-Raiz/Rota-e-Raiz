<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="estabelecimento.css" />

  <title>Cadastro de Restaurante</title>
</head>

<body>

  <section class="container">
    <button class="botao-voltar-cadastro" onclick="window.location.href='login.html'"><svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
  <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
</svg></button>

    <div class="titulo">
      <h1>Cadastro de Restaurante</h1>
      <span>Compartilhe sua história</span>
    </div>

    <form class="formulario">

      <!-- COLUNA ESQUERDA -->
      <div class="coluna">

        <div class="campo">
          <label>Nome do restaurante</label>
          <input type="text" placeholder="Coloque o nome aqui!" />
        </div>

        <div class="campo">
          <label>Email</label>
          <input
            type="email"
            placeholder="Ex: emaildoestabelecimento@gmail.com"
          />
        </div>

        <div class="campo">
          <label>Crie uma senha</label>
          <input type="password" placeholder="Senha..." />
        </div>

        <div class="campo">
          <label>Localização</label>
          <input type="text" placeholder="Endereço do restaurante" />
        </div>

        <div class="campo">
          <label>Horário de funcionamento</label>
          <input type="text" placeholder="Ex: das 11:00 às 19:00" />
        </div>

      </div>

      <!-- COLUNA DIREITA -->
      <div class="coluna">

        <div class="campo">
          <label>Tipo de estabelecimento</label>

          <select>
            <option>Restaurante</option>
            <option>Doceria</option>
            <option>Bar</option>
            <option>Cafeteria</option>
            <option>Lanches rápidos</option>
          </select>
        </div>

        <div class="campo">
          <label>Telefone para contato</label>
          <input type="text" placeholder="(71) 1234-5678" />
        </div>

        <div class="campo">
          <label>História do seu estabelecimento</label>

          <textarea
            placeholder="Conte sobre o seu negócio, origens, tradições, o que o torna especial..."
          ></textarea>
        </div>

      </div>

    </form>

    <button class="botao">Pronto !</button>

  </section>

</body>
</html>
