<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="estabelecimento.css" />

  <title>Cadastro de Restaurante</title>
</head>

<body>

  <section class="container">
    <button class="botao-voltar-cadastro" onclick="window.location.href='login.html'"><svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
  <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
</svg></button>

    <div class="titulo">
      <h1>Cadastro de Restaurante</h1>
      <span>Compartilhe sua história</span>
    </div>

    <form class="formulario" id="registerForm">

      <!-- COLUNA ESQUERDA -->
      <div class="coluna">

        <div class="campo">
          <label>Nome do restaurante</label>
          <input id="nomeRestaurante" name="nome" type="text" placeholder="Coloque o nome aqui!" required />
        </div>

        <div class="campo">
          <label>CNPJ</label>
          <input id="cnpj" name="cnpj" type="text" placeholder="00.000.000/0000-00" required />
        </div>

        <div class="campo">
          <label>Email</label>
          <input id="email" name="email"
            type="email"
            placeholder="Ex: emaildoestabelecimento@gmail.com"
            required
          />
        </div>

        <div class="campo">
          <label>Crie uma senha</label>
          <input id="senha" name="senha" type="password" placeholder="Senha..." required />
        </div>

        <div class="campo">
          <label>Localização</label>
          <input id="localizacao" name="endereco" type="text" placeholder="Endereço do restaurante" required />
        </div>

        <div class="campo">
          <label>Horário de funcionamento</label>
          <input id="funcionamento" name="horario" type="text" placeholder="Ex: das 11:00 às 19:00" required />
        </div>

      </div>

      <!-- COLUNA DIREITA -->
      <div class="coluna">

        <div class="campo">
          <label>Tipo de estabelecimento</label>

          <select id="tipo" name="tipo" required>
            <option>Restaurante</option>
            <option>Doceria</option>
            <option>Bar</option>
            <option>Cafeteria</option>
            <option>Lanches rápidos</option>
          </select>
        </div>

        <div class="campo">
          <label>Telefone para contato</label>
          <input id="telefone" name="telefone" type="text" placeholder="(71) 1234-5678" required />
        </div>

        <div class="campo">
          <label>História do seu estabelecimento</label>

          <textarea id="historia" name="historia" required
            placeholder="Conte sobre o seu negócio, origens, tradições, o que o torna especial..."
          ></textarea>
        </div>

      </div>

    </form>

    <button class="botao" id="finalizarBtn" type="submit">Pronto !</button>
    <p id="formMessage" role="status" aria-live="polite"></p>

  </section>

  <script src="estabelecimento.js"></script>
</body>
</html>
