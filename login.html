<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"/>
<link rel="stylesheet" href="login.css" />
  <title>Login</title>
</head>
<body>

  <section class="container">
    <button class="botao-voltar-login" onclick="window.location.href='proxima.html'" aria-label="Voltar para a página inicial">
      <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
      </svg>
    </button>

    <div class="titulo">
      <h1>Login</h1>
      <span>Bem vindo de volta!</span>
    </div>

    <div class="switch-login" aria-label="Escolha o tipo de conta">
      <button type="button" class="tipo-login ativo" data-tipo="cliente">Cliente</button>
      <button type="button" class="tipo-login" data-tipo="restaurante">Restaurante</button>
    </div>

    <form class="formulario form-login ativo" id="clienteLoginForm">
      <div class="campo">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="Ex: seuemail@gmail.com" />
      </div>

      <div class="campo">
        <label>Senha</label>
        <input type="password" id="regSenha" placeholder="Senha..." />
      </div>

      <button type="submit" class="botao" id="finalizarBtn">Entrar</button>

      <p id="formMessage"></p>

      <div class="links">
        <a href="#">Esqueci minha senha</a>
        <a href="pessoa.html">Não tem uma conta? Se cadastre aqui</a>
      </div>
    </form>

    <form class="formulario form-login" id="restauranteLoginForm">
      <div class="campo">
        <label>Email do restaurante</label>
        <input type="email" id="restauranteEmail" placeholder="Ex: contato@seu restaurante.com" />
      </div>

      <div class="campo">
        <label>Senha</label>
        <input type="password" id="restauranteSenha" placeholder="Senha..." />
      </div>

      <button type="submit" class="botao" id="loginRestauranteBtn">Entrar</button>

      <p id="formMessageRestaurante"></p>

      <div class="links">
        <a href="#">Esqueci minha senha</a>
        <a href="estabelecimento.html">Cadastre seu restaurante</a>
      </div>
    </form>
  </section>

  <script>
    const botoesTipoLogin = document.querySelectorAll('.tipo-login');
    const formularios = document.querySelectorAll('.form-login');

    botoesTipoLogin.forEach(botao => {
      botao.addEventListener('click', () => {
        const tipo = botao.dataset.tipo;

        botoesTipoLogin.forEach(item => item.classList.toggle('ativo', item === botao));
        formularios.forEach(formulario => {
          const ativo = formulario.id === `${tipo}LoginForm`;
          formulario.classList.toggle('ativo', ativo);
          formulario.style.display = ativo ? 'flex' : 'none';
        });
      });
    });
  </script>

</body>
</html>
